<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arvea · 直播提词工作台</title>
<link rel="icon" href="assets/logo-mark.svg" />
<style>
  :root{
    --canvas:#ffffff;
    --parchment:#f5f5f7;
    --pearl:#fafafc;
    --ink:#1d1d1f;
    --ink-80:#333333;
    --muted:#6e6e73;
    --muted-48:#7a7a7a;
    --hairline:#e0e0e0;
    --primary:#0066cc;
    --primary-hover:#0071e3;
    --primary-soft:#f4f9ff;
    --blue-wash:#e9f3fe;
    --radius-lg:18px;
    --radius-pill:9999px;
    --font:"OpenAI Sans","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--canvas);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;letter-spacing:.01em;
    min-height:100vh;display:flex;flex-direction:column;
  }
  @media (min-height:700px){
    body{height:100vh;overflow:hidden}
  }
  body.leaving{opacity:0;transform:translateY(-6px);transition:opacity .26s ease,transform .26s ease}

  /* ---------- 背景：底部蓝色薄雾 + 网状连线 ---------- */
  .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bg .wash{
    position:absolute;left:50%;bottom:-28vh;width:150vw;height:78vh;transform:translateX(-50%);
    background:radial-gradient(60% 60% at 50% 60%, var(--blue-wash) 0%, rgba(233,243,254,.55) 42%, rgba(255,255,255,0) 72%);
  }
  .bg .wash.top{
    top:-40vh;bottom:auto;height:90vh;
    background:radial-gradient(60% 60% at 50% 35%, rgba(244,249,255,.55) 0%, rgba(255,255,255,0) 78%);
  }
  #net{position:fixed;inset:0;z-index:0;pointer-events:none}
  .glow{
    position:fixed;left:0;top:0;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;
    background:radial-gradient(circle, rgba(0,113,227,.075), rgba(0,113,227,.03) 42%, rgba(255,255,255,0) 68%);
    pointer-events:none;will-change:transform;z-index:0;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;gap:14px;
    height:56px;padding:0 28px;
    background:transparent;border-bottom:1px solid transparent;
    transition:background .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .topbar.scrolled{
    background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(18px);
    border-bottom-color:var(--hairline);box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .topbar .mark{width:22px;height:22px;background:url("assets/logo-mark.svg") no-repeat center/contain}
  .topbar .name{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.01em}
  .topbar .sub{font-size:13px;color:var(--muted)}
  .topbar .sp{margin-left:auto;display:flex;gap:22px;font-size:13px}
  .topbar a{color:var(--muted);text-decoration:none;transition:color .16s}
  .topbar a:hover{color:var(--primary)}

  /* ---------- 主视觉 ---------- */
  main{
    position:relative;z-index:1;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:3.5vh 24px 2.5vh;
  }

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.12em;color:var(--primary);font-weight:600;
    margin-bottom:22px;
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--primary);display:block}

  .logo-wrap{margin-bottom:18px;will-change:transform}
  .logo{
    width:clamp(96px,12vh,132px);height:auto;display:block;
    animation:rise .55s cubic-bezier(.2,.7,.2,1) both;
  }
  .logo-wrap.pop .logo{animation:pop .42s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{40%{transform:scale(1.06)}}

  h1{
    font-size:clamp(32px,5.4vh,62px);font-weight:700;letter-spacing:-.035em;line-height:1.06;
    max-width:16em;
    animation:rise .6s .04s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{transform:translateY(12px)}to{transform:none}}

  .lede{
    margin-top:18px;font-size:clamp(15px,1.9vh,18px);line-height:1.6;color:var(--muted);
    white-space:nowrap;animation:rise .6s .08s cubic-bezier(.2,.7,.2,1) both;
  }
  @media (max-width:820px){ .lede{white-space:normal;max-width:22em} }

  .cta{
    display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center;
    margin-top:30px;animation:rise .6s .12s cubic-bezier(.2,.7,.2,1) both;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
    font-family:inherit;font-size:clamp(14px,1.75vh,17px);font-weight:500;
    color:#fff;background:var(--primary);border-radius:var(--radius-pill);
    padding:12px 26px;transition:background .18s ease,transform .18s ease;
  }
  .btn:hover{background:var(--primary-hover);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn svg{transition:transform .2s ease}
  .btn:hover svg{transform:translateX(3px)}
  .link{
    font-size:clamp(13px,1.7vh,16px);color:var(--primary);text-decoration:none;
    display:inline-flex;align-items:center;gap:5px;transition:color .16s;
  }
  .link:hover{color:var(--primary-hover)}
  .note{margin-top:16px;font-size:12.5px;color:#a1a1a6;animation:rise .6s .16s cubic-bezier(.2,.7,.2,1) both}

  /* ---------- 三张说明卡 ---------- */
  .facts{
    position:relative;z-index:1;
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
    width:100%;max-width:900px;margin:2vh auto 3vh;padding:0 24px;
    animation:rise .6s .2s cubic-bezier(.2,.7,.2,1) both;
  }
  @media (max-width:780px){ .facts{grid-template-columns:1fr} }
  .fact{
    background:transparent;border:0;border-radius:0;
    padding:0 8px;text-align:left;
    transition:transform .22s cubic-bezier(.2,.7,.2,1);
  }
  .fact:hover{transform:translateY(-3px)}
  .fact .ico{
    width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--primary-soft);color:var(--primary);margin-bottom:13px;
  }
  .fact b{display:block;font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:7px;letter-spacing:-.005em}
  .fact span{display:block;font-size:13px;line-height:1.6;color:var(--muted-48)}

  footer{
    position:relative;z-index:1;
    padding:4px 28px 18px;text-align:center;
    font-size:12px;color:#a1a1a6;background:transparent;border:0;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap,h1,.lede,.cta,.facts,.eyebrow,.note{animation:none!important}
    body.leaving{transition:none}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="wash top"></span>
  <span class="wash"></span>
  <canvas id="net"></canvas>
  <div class="glow" id="glow"></div>
</div>

<div class="topbar">
  <span class="mark"></span>
  <span class="name">Arvea</span>
  <span class="sub">提词工作台</span>
  <span class="sp">
    <a href="studio.html">开始制作</a>
    <a href="guide.html">使用说明</a>
  </span>
</div>

<main>
  <div class="eyebrow"><i></i>LIVE · 直播提词</div>

  <div class="logo-wrap" id="logoWrap"><img class="logo" src="assets/logo-mark.svg" alt="Arvea" id="logo" /></div>

  <h1>让每一句话<br />都在该说的时候出现</h1>
  <p class="lede">把脚本变成中控屏上的提词：板块分明，一句一行，时间自己走。</p>

  <div class="cta">
    <button class="btn" id="goWork">
      开始制作提词
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h13M12.5 5.5L19 12l-6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <a class="link" href="guide.html">看看怎么用 ›</a>
  </div>

  <p class="note">全程本地处理，脚本不上传。</p>
</main>

<div class="facts">
  <div class="fact">
    <div class="ico">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 16v2.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <b>拖 docx 就解析</b>
    <span>本地读取，不联网、不上传，松手即出结果。</span>
  </div>
  <div class="fact">
    <div class="ico">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h11M4 18h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <b>按说话人分短句</b>
    <span>一句一行，标明是谁在说，视线不乱跑。</span>
  </div>
  <div class="fact">
    <div class="ico">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="7.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 9.5V13l2.5 1.8M9 3h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <b>计时与切换提示</b>
    <span>每个板块倒计时，到点提醒切下一段。</span>
  </div>
</div>

<footer>Arvea · 直播提词工作台</footer>

<script>
/* 背景互动：光圈跟随 + 网状连线 */
(function(){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const still = /[?&]static=1/.test(location.search);   // 静态模式：不跑动画，便于截图/打印

  const glow = document.getElementById("glow");
  let tx = window.innerWidth / 2, ty = window.innerHeight * 0.4;
  let cx = tx, cy = ty;
  glow.style.transform = `translate3d(${tx}px,${ty}px,0)`;

  const follow = e => {
    tx = e.clientX; ty = e.clientY;
    const r = document.documentElement.style;
    r.setProperty("--px", ((e.clientX / window.innerWidth - .5) * 2).toFixed(3));
    r.setProperty("--py", ((e.clientY / window.innerHeight - .5) * 2).toFixed(3));
  };
  document.addEventListener("pointermove", follow, {passive:true});
  document.addEventListener("pointerenter", follow, {passive:true});

  const canvas = document.getElementById("net");
  const ctx = canvas && canvas.getContext ? canvas.getContext("2d", { alpha: true }) : null;
  if (!ctx) return;                       // 浏览器不支持 canvas 时，页面照常显示，不报错
  let W = 0, H = 0, DPR = 1, pts = [];
  const LINK = 150, MLINK = 205;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.max(40, Math.min(150, Math.round(W * H / 15000)));
    if (!pts.length){
      pts = Array.from({length:n}, () => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45
      }));
    }
  }
  resize();
  window.addEventListener("resize", resize);

  let mx = -9999, my = -9999, hasPointer = false;
  document.addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; hasPointer = true; }, {passive:true});
  document.addEventListener("pointerleave", () => { hasPointer = false; mx = my = -9999; });

  const logoWrap = document.getElementById("logoWrap");
  let raf = null;

  function advance(){
    for (const p of pts){
      p.x += p.vx; p.y += p.vy;
      if (p.x < -30) p.x = W + 30; else if (p.x > W + 30) p.x = -30;
      if (p.y < -30) p.y = H + 30; else if (p.y > H + 30) p.y = -30;

      if (hasPointer){
        const dx = p.x - mx, dy = p.y - my, d = Math.hypot(dx, dy);
        if (d < 150 && d > 0.001){
          const f = (1 - d / 150) * 0.05;
          p.vx += (dx / d) * f; p.vy += (dy / d) * f;
        }
      }
      p.vx *= 0.995; p.vy *= 0.995;
      if (Math.abs(p.vx) < 0.12) p.vx += (Math.random() - .5) * 0.05;
      if (Math.abs(p.vy) < 0.12) p.vy += (Math.random() - .5) * 0.05;
    }
  }

  function paint(){
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < pts.length; i++){
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++){
        const b = pts[j];
        const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < LINK * LINK){
          const k = 1 - Math.sqrt(d2) / LINK;
          ctx.strokeStyle = "rgba(0,102,204," + (k * 0.20).toFixed(3) + ")";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      if (hasPointer){
        const dxm = a.x - mx, dym = a.y - my, dm = Math.hypot(dxm, dym);
        if (dm < MLINK){
          const k = 1 - dm / MLINK;
          ctx.strokeStyle = "rgba(0,113,227," + (k * 0.30).toFixed(3) + ")";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mx, my); ctx.stroke();
        }
      }
      ctx.fillStyle = "rgba(0,102,204,.30)";
      ctx.beginPath(); ctx.arc(a.x, a.y, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function step(){
    cx += (tx - cx) * 0.14; cy += (ty - cy) * 0.14;
    glow.style.transform = `translate3d(${cx}px,${cy}px,0)`;
    const px = (cx / window.innerWidth - .5) * 2;
    const py = (cy / window.innerHeight - .5) * 2;
    logoWrap.style.transform = `translate3d(${(px * 9).toFixed(2)}px,${(py * 7).toFixed(2)}px,0)`;
    advance();
    paint();
    raf = requestAnimationFrame(step);
  }

  const canAnimate = !reduce && !still && typeof requestAnimationFrame === "function";
  if (canAnimate){
    raf = requestAnimationFrame(step);
  } else {
    paint();                                   // 静止模式也画一帧，保证看得到网
    window.addEventListener("resize", ()=>{ resize(); paint(); });
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ cancelAnimationFrame(raf); raf = null; }
    else if (!reduce && !raf){ raf = requestAnimationFrame(step); }
  });

  document.getElementById("logo").addEventListener("click", () => {
    const w = document.getElementById("logoWrap");
    w.classList.remove("pop"); void w.offsetWidth; w.classList.add("pop");
  });
})();

/* 顶栏：滚动后才浮起，避免顶部出现一条“分页线” */
const bar = document.querySelector(".topbar");
const onScroll = () => bar.classList.toggle("scrolled", window.scrollY > 6);
window.addEventListener("scroll", onScroll, {passive:true});
onScroll();

/* 去工作台：先淡出，再跳转 */
function go(url){
  document.body.classList.add("leaving");
  setTimeout(()=> location.href = url, 240);
}
document.getElementById("goWork").onclick = () => go("studio.html?from=home");
document.querySelectorAll('.topbar a[href$=".html"]').forEach(a => {
  a.addEventListener("click", e => {
    e.preventDefault();
    const href = a.getAttribute("href");
    go(href.indexOf("?") >= 0 ? href + "&from=home" : href + "?from=home");
  });
});
</script>
</body>
</html>
