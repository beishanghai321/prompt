<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>敖东植物甾醇银杏叶片 · 提词</title>
<link rel="icon" href="assets/logo-mark.svg" />
<style>

  :root{
    --bg:#f5f5f7;
    --surface:#ffffff;
    --paper:#f7f7f9;
    --surface-2:#f5f5f7;
    --line:#e6e6eb;
    --line-strong:#d2d2d7;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --ink-3:#86868b;
    --blue:#0071e3;
    --blue-hover:#0077ed;
    --blue-soft:#f0f6ff;
    --green-soft:#f0f9f4;
    --green-line:#d5ebdf;
    --green-ink:#0e6b46;
    --red:#d70015;
    --amber-ink:#a8630a;
    --shadow:0 1px 2px rgba(0,0,0,.03), 0 10px 30px rgba(0,0,0,.035);
    --radius:18px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:.005em;
  }

  /* ================= 导入视图 ================= */
  #setup{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:3vh 6vw;overflow:auto}
  #setup .inner{width:100%;max-width:1180px;margin:0 auto}
  #setup .top{margin-bottom:26px}
  #setup h1{font-size:clamp(26px,3.6vh,40px);font-weight:600;letter-spacing:-.02em;line-height:1.15}
  #setup h1 span{color:var(--ink-3)}
  #setup .sub{color:var(--ink-2);font-size:clamp(13px,1.7vh,17px);line-height:1.6;margin-top:8px;font-weight:400}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:980px){ .grid{grid-template-columns:1fr} }

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 20px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);
  }
  .card h2{
    font-size:clamp(13px,1.7vh,16px);color:var(--ink);font-weight:600;margin-bottom:14px;
    display:flex;align-items:center;gap:10px;
  }
  .card h2 em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:.86em}
  .card h2 .sp{margin-left:auto}

  #drop{
    border:1.5px dashed var(--line-strong);border-radius:14px;flex:1;min-height:20vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--ink-2);font-size:clamp(12px,1.55vh,15px);text-align:center;cursor:pointer;
    transition:.18s;padding:26px;background:var(--surface-2);
  }
  #drop:hover,#drop.over{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  #drop b{font-size:clamp(15px,2.1vh,20px);color:var(--ink);font-weight:600}
  #drop:hover b,#drop.over b{color:var(--blue)}
  #drop small{color:var(--ink-3)}

  textarea{
    flex:1;min-height:20vh;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);
    border-radius:14px;padding:14px 16px;font-size:clamp(12px,1.55vh,15px);line-height:1.65;
    font-family:var(--font);resize:none;outline:none;transition:.18s;
  }
  textarea::placeholder{color:#b0b0b5}
  textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.12)}

  .opts{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:18px;font-size:clamp(11px,1.45vh,14px);color:var(--ink-2)}
  .opts label{display:flex;align-items:center;gap:8px}
  .opts input[type=text],.opts input[type=number]{
    background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);
    border-radius:10px;padding:8px 12px;font-family:var(--font);font-size:1em;outline:none;transition:.18s;
  }
  .opts input[type=text]{width:15em}
  .opts input[type=number]{width:4.6em}
  .opts input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.12)}
  .opts input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px}

  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
  button.primary{
    font-family:var(--font);font-size:clamp(13px,1.75vh,17px);font-weight:500;color:#fff;
    background:var(--blue);border:0;border-radius:980px;padding:11px 30px;cursor:pointer;
    letter-spacing:.01em;transition:.18s;
  }
  button.primary:hover{background:var(--blue-hover);transform:translateY(-.5px)}
  button.primary:active{transform:none}
  button.ghost{
    font-family:var(--font);font-size:clamp(12px,1.55vh,15px);color:var(--blue);background:transparent;
    border:1px solid var(--line-strong);border-radius:980px;padding:10px 22px;cursor:pointer;transition:.18s;
  }
  button.ghost:hover{background:var(--surface);border-color:#bfbfc4}

  .stat{margin-left:auto;color:var(--ink-3);font-size:clamp(11px,1.45vh,14px);line-height:1.5;text-align:right}
  .stat b{color:var(--ink);font-weight:600}

  .tips{margin-top:22px;color:var(--ink-3);font-size:clamp(11px,1.4vh,13px);line-height:1.9}
  .tips code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink-2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.94em}

  /* 导入卡三态：drop / 解析中 / 解析完成 */
  .card.import{position:relative}
  .card.import .pbox,.card.import .dbox{display:none}
  .card.import.busy #drop,.card.import.ready #drop{display:none}
  .card.import.busy .pbox{display:flex}
  .card.import.ready .dbox{display:flex}

  .pbox,.dbox{
    flex:1;min-height:20vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);padding:26px;
  }
  .dbox{flex-direction:column;gap:16px}
  .spin{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid #e2e2e7;border-top-color:var(--blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .ptxt{text-align:center;line-height:1.5}
  .ptxt b{display:block;color:var(--ink);font-size:clamp(13px,1.7vh,16px);font-weight:600;max-width:34em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptxt span{color:var(--ink-3);font-size:clamp(11px,1.4vh,13px)}
  .pbar{width:min(260px,70%);height:3px;background:#e6e6eb;border-radius:99px;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .dok{
    width:36px;height:36px;border-radius:50%;background:#e8f6ee;color:#0e6b46;
    display:flex;align-items:center;justify-content:center;animation:pop .34s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .dact{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* 视图切换过渡 */
  #setup{transition:opacity .24s ease,transform .24s ease}
  #setup.leaving{opacity:0;transform:translateY(-10px);pointer-events:none}
  #prompter{opacity:0;transform:translateY(14px);transition:opacity .3s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1)}
  #prompter.on{display:flex}
  #prompter.shown{opacity:1;transform:none}
  /* 历史 */
  .card.hist{margin-top:20px}
  #hist{display:flex;flex-direction:column}
  .hitem{
    display:flex;align-items:center;gap:14px;padding:13px 4px;cursor:pointer;
    border-top:1px solid var(--line);font-size:clamp(11px,1.45vh,14px);transition:.16s;
  }
  .hitem:first-child{border-top:0}
  .hitem:hover{background:var(--surface-2);border-radius:10px;padding-left:10px;padding-right:10px}
  .hitem .hdate{color:var(--ink-3);min-width:6.4em;font-variant-numeric:tabular-nums}
  .hitem .htitle{color:var(--ink);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hitem .hmeta{color:var(--ink-3);white-space:nowrap}
  .hitem .del{
    color:#c7c7cc;background:none;border:0;cursor:pointer;font-size:1.25em;line-height:1;
    padding:0 6px;font-family:var(--font);transition:.16s;
  }
  .hitem .del:hover{color:var(--red)}
  .empty{color:var(--ink-3);padding:14px 2px;font-size:clamp(11px,1.45vh,14px)}
  .mini{font-size:clamp(10px,1.3vh,13px);padding:6px 14px}

  /* ================= 提词视图 ================= */
  #prompter{height:100vh;display:none;background:var(--paper)}
  #prompter.on{display:flex}

  .rail{
    width:190px;min-width:170px;background:#f0f0f3;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 0 12px;
  }
  .rail .brand{padding:0 16px 14px;font-size:11.5px;color:var(--ink-3);line-height:1.45;letter-spacing:.01em}
  .rail .brand b{
    color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35;
  }
  .navbtn{
    display:flex;gap:8px;align-items:baseline;padding:9px 12px;margin:2px 8px;border-radius:10px;
    cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink-2);
    text-align:left;width:calc(100% - 16px);font-family:var(--font);transition:.16s;
  }
  .navbtn:hover{background:rgba(0,0,0,.035);color:var(--ink)}
  .navbtn .no{font-size:14px;font-weight:600;color:#b0b0b5;min-width:1.2em}
  .navbtn .nm{font-size:13px;font-weight:500;line-height:1.3;color:inherit}
  .navbtn .tm{font-size:10.5px;color:var(--ink-3);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
  .navbtn.on{background:var(--surface);border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.05);color:var(--ink)}
  .navbtn.on .no{color:var(--blue)}

  .legend{margin-top:auto;padding:12px 16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
  .legend .lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
  .legend .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .legend .hint{color:#b0b0b5;font-size:10.5px;line-height:1.8;margin-top:4px}
  .legend .back{margin-top:10px}
  .legend .back button{
    width:100%;font-family:var(--font);font-size:12.5px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:980px;padding:8px 10px;cursor:pointer;transition:.16s;
  }
  .legend .back button:hover{border-color:#bfbfc4;background:#fff}

  /* 侧栏折叠 */
  .rail{transition:width .34s cubic-bezier(.4,0,.2,1);overflow:hidden}
  .rail-top{display:flex;align-items:center;justify-content:flex-end;padding:0 10px 8px}
  .rail-toggle{
    width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;
    transition:color .16s,border-color .16s,transform .16s;
  }
  .rail-toggle:hover{color:var(--blue);border-color:#c7d9f0}
  .rail-toggle:active{transform:scale(.94)}
  .rail-toggle svg{transition:transform .34s cubic-bezier(.4,0,.2,1)}
  .rail.collapsed{width:62px}
  .rail.collapsed .rail-toggle svg{transform:rotate(180deg)}
  .rail.collapsed .brand,
  .rail.collapsed .legend,
  .rail.collapsed .navbtn .nm,
  .rail.collapsed .navbtn .tm{opacity:0;pointer-events:none}
  .rail .brand,.rail .navbtn .nm,.rail .navbtn .tm,.rail .legend{transition:opacity .2s ease}
  .rail.collapsed .navbtn{justify-content:center;padding-left:0;padding-right:0}
  .rail.collapsed .navbtn .no{min-width:0}
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;padding:22px 34px 0}
  .head{
    display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;width:100%;max-width:1400px;margin:0 auto;
    padding-bottom:14px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .head .ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .head .num{font-size:clamp(24px,3.4vh,40px);font-weight:600;color:var(--blue);letter-spacing:-.02em;line-height:1}
  .head h1{font-size:clamp(20px,2.9vh,32px);font-weight:600;letter-spacing:-.02em;color:var(--ink)}
  .head .win{
    font-size:clamp(11px,1.4vh,14px);color:var(--blue);font-weight:500;
    background:var(--blue-soft);border-radius:980px;padding:5px 12px;white-space:nowrap;
  }
  .clock{margin-left:auto;text-align:right;min-width:120px}
  .clock .t{
    font-variant-numeric:tabular-nums;font-size:clamp(22px,3.4vh,40px);font-weight:600;letter-spacing:-.01em;
    font-feature-settings:"tnum";color:var(--ink);line-height:1;
  }
  .clock .t.warn{color:var(--amber-ink)}
  .clock .t.over{color:var(--red)}
  .clock .bar{height:3px;background:#ececf0;border-radius:99px;margin-top:8px;overflow:hidden}
  .clock .bar i{display:block;height:100%;width:100%;background:var(--blue);transition:width .3s linear}
  .clock .hint{font-size:10.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.02em}

  .fsbar{
    display:flex;align-items:center;gap:2px;margin-left:10px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:980px;padding:3px 4px;font-size:12px;color:var(--ink-3);
  }
  .fsbar button{
    font-family:var(--font);font-size:12px;font-weight:500;color:var(--ink-2);background:transparent;
    border:0;border-radius:980px;width:30px;height:26px;line-height:1;cursor:pointer;transition:.16s;
  }
  .fsbar button:hover{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .fsbar .now{min-width:58px;text-align:center;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:11px}

  .cues{
    list-style:none;flex:1;min-height:0;width:100%;max-width:1400px;margin:0 auto;
    overflow-y:auto;overflow-x:hidden;font-size:var(--fs,2.1vh);padding:18px 2px 60vh 0;
    scrollbar-width:thin;scrollbar-color:#c7c7cc transparent;
  }
  .cues::-webkit-scrollbar{width:10px}
  .cues::-webkit-scrollbar-track{background:transparent}
  .cues::-webkit-scrollbar-thumb{background:#dcdce1;border-radius:99px}
  .cues::-webkit-scrollbar-thumb:hover{background:#c7c7cc}

  .cues li{display:block;padding:4px 12px 6px 8px;border-radius:10px;font-size:1em;color:var(--ink)}
  .cues li.start{padding-top:14px;border-top:1px solid #eeeef2;margin-top:2px}
  .cues li.start:first-child{border-top:0;padding-top:0}
  .cues li .line{display:flex;gap:12px;align-items:flex-start;line-height:1.5}
  .cues li .line + .line{margin-top:2px}

  .sp{
    flex:0 0 auto;font-weight:500;border-radius:7px;padding:2px 8px;margin-top:3px;
    font-size:.66em;white-space:nowrap;min-width:4.6em;text-align:center;letter-spacing:.01em;
    background:var(--surface-2);color:var(--ink-2);
  }
  .sp.zeng{color:#0066cc;background:#eaf3fd}
  .sp.sun{color:#a8630a;background:#fdf3e6}
  .sp.s3{color:#6b3fd4;background:#f2edfe}
  .sp.s4{color:#0e6b46;background:#e9f7ef}
  .sp.go{color:#0e6b46;background:#e3f5ec}
  .sp.ctl{color:#3d5a80;background:#eef3f9}
  .sp.cont{background:none;color:#c7c7cc}

  .say{flex:1;min-width:0}
  .say b{color:var(--ink);font-weight:600}
  .say em{font-style:normal;color:var(--blue);font-weight:500}

  .cues li.special{background:#f4faf6;border:1px solid #e0efe6;border-radius:12px;margin-top:14px;padding:10px 12px}
  .cues li.special .say{color:var(--green-ink)}

  /* 句子悬停高亮：轻底色 + 左侧细条，不改变排版 */
  @media (hover:hover){
    .cues li{position:relative;border-radius:8px;transition:background-color .16s ease}
    .cues li::before{
      content:"";position:absolute;left:1px;top:.2em;bottom:.2em;width:2px;border-radius:2px;
      background:var(--blue);opacity:0;transform:scaleY(.6);transform-origin:center;
      transition:opacity .16s ease,transform .16s ease;
    }
    .cues li:hover{background:rgba(0,113,227,.055)}
    .cues li:hover::before{opacity:.55;transform:scaleY(1)}
    .cues li.special:hover{background:#eef7f1;border-color:#cbe6d8}
    .cues li:hover .say{color:#0b0b0c}
  }
  .flash{position:fixed;inset:0;pointer-events:none;display:none;box-shadow:inset 0 0 0 3px rgba(215,0,21,.35)}
  .flash.on{display:block;animation:soft 1.6s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}

  /* 模板独立运行时直接显示提词视图（不需要过渡） */
  #prompter{display:flex;opacity:1;transform:none}
</style>
</head>
<body>
<section id="prompter">
  <nav class="rail" id="rail">
    <div class="rail-top">
      <button class="rail-toggle" id="railToggle" title="收起 / 展开（[）" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true">
          <path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="brand" id="brand"><b>敖东植物甾醇银杏叶片</b></div>
    <div class="tagline">让每一句话，都在该说的时候出现</div>
    <div id="nav"></div>
    <div class="legend">
      <div id="legendSpeakers" style="display:flex;flex-direction:column;gap:7px"></div>
      <div class="hint">滚轮 / ↑↓ 上下滑<br>← → 切板块 ｜ 1—9 直跳<br>空格 计时 ｜ R 归零 ｜ F 全屏<br>- = 调字号 ｜ [ 收起侧栏</div>
    </div>
  </nav>

  <main class="stage">
    <header class="head">
      <div class="ttl">
        <div class="num" id="hNum">①</div>
        <h1 id="hName">—</h1>
        <div class="win" id="hWin">—</div>
      </div>
      <div class="clock">
        <div class="t" id="clockT">00:00</div>
        <div class="bar"><i id="clockBar"></i></div>
        <div class="hint" id="clockHint">剩余时间 · 空格开始</div>
      </div>
      <div class="fsbar">
        <button id="fsDown" title="缩小字号（-）">A−</button>
        <span class="now" id="fsNow">字号</span>
        <button id="fsUp" title="放大字号（=）">A+</button>
      </div>
    </header>
    <ol class="cues" id="cues"></ol>
  </main>
</section>
<div class="flash" id="flash"></div>

<script>
const BLOCKS = [{"no":"①","name":"暖场留人","win":"0—4 分钟","dur":240,"cues":[["曾老师","叔叔阿姨早上好，欢迎来到敖东植物甾醇银杏叶片的官方直播间！我是既懂产品又懂营养的曾老师，国际注册营养师，也是今天的主播。刚进来的家人先别划走，今天不是普通的直播带货，是敖东70周年庆的厂家感恩直供专场。先跟大家说一句：敖东 70 载，感恩一路有你们，感谢大家一直以来的支持、理解和厚爱！"],["曾老师","来，屏幕上帮我扣个“70”，我看看有多少家人是陪着敖东一路走过来的。扣“70”的家人，今天来了，绝对不亏。"],["曾老师","我先说三件事：第一，今天有红包，开场一轮，整点还有，红包不停，福利不止；第二，整点、半点有抽奖，银杏叶片、驼绒被统统都有，免费送；第三，今天我特意把咱们敖东厂家的品牌运营总监孙总请到了直播间，孙总手里握着周年专项配额，今天的福利，都要孙总来拍板。"],["曾老师","（抛出70岁专属福利钩子）在孙总出场前，我先给大家透个底，加个重磅福利！"],["曾老师","咱们敖东今年建厂70周年，为了感恩老一辈，今年只要是70岁的叔叔阿姨，今天在直播间下单过的都可以找你们的健康顾问出示您的身份证，咱们厂家额外再多送您一瓶银杏叶片！ 家有一老如有一宝，这是咱们敖东给长辈们专属的敬礼！家里有70岁老人的，或者您自己今年过70大寿的，今天这波福利千万别错过！"],["曾老师","接下来，屏幕上扣个 “1” 让我看看，今天直播间有没有之前在外边买过我们这款银杏叶片吃着吃着停下来的，或者一直在坚持吃、有真实感受的叔叔阿姨（曾老师手持银杏叶片产品展示），扣 “1” 的家人，等一下孙总讲的时候你们认真听，今天的机制就是给你们争取的；有感受的，顺手打在公屏上，跟新朋友说道说道。好了，话不多说，接下来让我隆重欢迎一下我们的孙总。"],["孙总","直播间的家人们，大家好，我是敖东厂家品牌运营总监孙星，非常开心能在直播间跟大家相见，刚看到很多叔叔阿姨的留言，很感谢各位家人这么多年对敖东的信任，刚刚曾老师说的那个“70岁老人凭身份证多送一瓶”的福利，我在这里给大家盖个章，绝对有效！"],["孙总","这次为什么会有这场直播？第一，敖东70周年，厂家给大家送福利；第二，客服反馈大家需求量很大，想要个更划算的价格，所以我今天专程来给大家破价。先给各位叔叔阿姨发个红包吧！"],["孙总","（第一轮红包）"],["曾老师","家人们，红包已经发了，没抢到的别急，整点还有。孙总，我替大家问一句，今天到底凭什么便宜？"],["孙总","凭两点：第一，70周年庆，集团给了政策；第二，今天工厂直发，没有中间商。便宜不是产品打折，是把中间那一道省下来给大家。"],["曾老师","我补一句，我是营养师，平时看配方成分、看检测报告多，今天产品这块我给大家讲透，价格这块让孙总给到底。"]],"next":"本块最后一句说完，就接下一块：叔叔阿姨，说到产品，咱们先聊聊大家现在的身体状态。我刚刚看到很多家人的留言，特别真实。有的说…（4—7 分钟 开始【痛点唤醒】）","ctrl":"配合主播助播指令发红包；公屏置顶“70周年庆·厂家直供”；新人进房欢迎语带“扣70”。"},{"no":"②","name":"痛点唤醒","win":"4—7 分钟","dur":180,"cues":[["曾老师","叔叔阿姨，说到产品，咱们先聊聊大家现在的身体状态。我刚刚看到很多家人的留言，特别真实。有的说头沉发闷舒服一些了，有的说坚持下来状态稳很多。"],["曾老师","但今天新进直播间的叔叔阿姨，咱们扪心自问一下，您有没有这四个情况？我不吓唬人，就做个小测试，中了的在屏幕上扣个“中”："],["曾老师","第一，去年体检报告单上，“低密度脂蛋白”或者“甘油三酯”后面，是不是跟着一个向上翘的小箭头？"],["曾老师","第二，吃完饭特别容易犯困，往沙发上一坐就不想动，一到下午脑袋发沉、发闷？"],["曾老师","第三，爬两层楼就得歇一歇，腿发沉，走快了觉得胸口发紧、气不够用？"],["曾老师","第四，平时口味偏重，爱吃肉爱吃油，又经常坐得多、动得少？"],["曾老师","来，公屏上打出来，您中了几条？"],["孙总","曾老师，公屏上“中”已经刷起来了，好多家人四条全中。"],["曾老师","四条全中的家人，我不跟您说吓人的话，我只说一句：千万别拖！"],["曾老师","很多家人指标偏高了，身上没有难受，就觉得不用管，这是很大的误区！大家想想，咱们家里的自来水管，用了几十年，管壁上是不是会悄悄结一层水垢？咱们的血管也是一样的，油脂悄悄沉积，慢慢变窄，它不是一天形成的。"],["曾老师","血脂高不是小毛病，它不疼不痒，最容易被当成小事。但一旦堵在心上、堵在脑上，那可能就是三五秒钟的事情；如果脂肪堆积在肝里，硬化了，咱们看不见；但如果影响到了眼睛和手脚，轻点走路画圈，重点可能就直接躺在床上了，吃喝拉撒都要人伺候。人上了年纪怕啥？第一怕自个身体不好，第二怕给家人添负担。真到了那个时候，花的就不是几十几百，而是几万几十万了，钱花光了人还遭罪，全家跟着受拖累。"],["曾老师","但是，我今天也要把话说清楚（严正声明）： 如果您现在有头晕、手麻脚麻、胸口闷、说话不利索，第一件事是去医院查！别在直播间买保健品当药吃，药的事归医生。我们今天讲的，是查完之后、指标偏高、医生也让您注意饮食和运动的这种情况下，日常怎么养护。"],["曾老师","既然是日常养护，那就有个很现实的问题。我刚刚看到留言，不少扣1的家人，吃到后面停了，核心就是三个字：舍不得、吃不长、总断档。"],["曾老师","血管养护，最怕断断续续！吃几个月停两个月，刚稳住又堆积，钱花了，调理效果很难持续。养护拼的不是吃几天，是长期稳定。"],["曾老师","想要长期坚持，只有两个关键点：第一，单价够实在；第二，一次拿到足量。"],["曾老师","孙总，您说是不是这个道理？如果价格高、量又少，大家就算认可敖东植物甾醇银杏叶片，觉得效果好，也很难长期坚持啊。"],["孙总","道理没错，但是原料成本、产能摆在这，平时的活动机制已经是底线了。"],["曾老师","所以今天，趁着咱们敖东70周年，咱们必须跟厂家申请一个“能吃得起、吃得好”的超大补贴！今天不仅有专项补贴，还要给足量！孙总，咱们今天必须给直播间的叔叔阿姨们交个底！"]],"next":"本块最后一句说完，就接下一块：好，家人们，在跟孙总申请今天的70周年厂家补贴政策之前，咱们得先弄明白：这瓶东西到底怎么起作…（7—12 分钟 开始【品牌塑品】）","ctrl":"每问一条，公屏引导“中”；同步弹出“本品不能代替药物”字幕条；把“四条全中”的评论置顶。"},{"no":"③","name":"品牌塑品","win":"7—12 分钟","dur":300,"cues":[["曾老师","好，家人们，在跟孙总申请今天的70周年厂家补贴政策之前，咱们得先弄明白：这瓶东西到底怎么起作用的？为什么它值这个价？"],["曾老师","今天咱们讲的，是敖东牌植物甾醇银杏叶片。瓶身上有个“蓝帽子”，批号是国食健注G20250013，国家批准的保健功能写得很清楚：有助于维持血脂健康水平。注意，是“维持”，它不是药，这是分界线。适合血脂偏高的叔叔阿姨，那它为什么管用？两个核心成分，我给大家用大白话讲透："],["曾老师","第一个叫植物甾醇，它的作用是“拦”。 它的结构和坏胆固醇长得像，吃进去后，就像厨房里的吸油纸，或者排队时前面先站了个人，把肠道里的位置占住，让多余的油脂少吸收一点。"],["曾老师","第二个叫银杏叶提取物，它的作用是“护”。 它里面的总黄酮醇苷，干的是日常养护的活儿。上了年纪循环慢，容易发沉发困，它能帮着日常养一养。"],["曾老师","含量我不空口说，全印在瓶身上：每100克含植物甾醇35克，吃8片就有1.1克左右。"],["曾老师","怎么吃？大家记好：每次4片，一天2次，饭后吃，早晚各一次，规律坚持效果才好。"],["孙总","曾老师我看有家人在问，在吃降脂药，还能不能吃这个？"],["曾老师","问得好。第一，药不能停，听医生的；第二，要吃，跟药错开半小时以上，像吃阿司匹林、华法林的，错开1-2小时，安全永远第一。大家记住了啊，保健食品不是药物，不能代替药物治疗疾病！"],["曾老师","还有家人问，鱼油、卵磷脂要不要一起吃？可以搭，但别一把一把地吃，按说明来，别叠加过量。营养这事，讲究的是够用，不是越多越好。"],["孙总","曾老师讲得很严谨啊。我看公屏上有家人问，这牌子到底靠不靠谱？今天我来给大家交个实底，咱们用实力说话。"],["孙总","大家看这个（桌上放的老字号牌）还有背后大屏幕（示意大家看背景视频）："],["孙总","第一，中华老字号！敖东是正儿八经被国家商务部盖章认证的中华老字号。第二，上市企业，咱们的股权代码是000623，这都是能在股市上查得到的真金白银。第三，在2024年中国医药市场药企排行榜里，咱们吉林敖东排在百强第58位！品牌价值更是高达117.78亿！"],["孙总","咱们不仅有自己的科研大楼、自有工厂，从原料筛选到生产质检，每一步都是严格把控。大家买东西，最怕买到“查不到出处”的。这款产品，线下药店、线上平台都有同款在卖，大家随时可以去对比。70年的大厂，靠的就是品质和口碑，咱们绝对不忽悠！"],["曾老师","好，家人们，大家听明白了吧？中华老字号、上市企业、医药百强、百亿品牌价值！70年大厂底蕴，加上国家蓝帽认证、实打实的成分。既然东西这么靠谱，孙总，那咱们今天就得说点实在的了。刚才公屏上好多家人在说，产品好是好，但要想长期吃、不断档，就怕价格高、量又少，吃几个月停了，钱花了效果没稳住。"],["曾老师","那孙总，我看很多家人都是想买，想坚持吃，就是价格让他们有点犹豫，那这次敖东70周年，您看是不是得拿出一份能让普通人吃得起、不心疼、能坚持的方案！"],["孙总","我也知道大家需要长期吃，回馈家人肯定要回馈，但原料成本摆在这，咱们得有个可控的方案……"]],"next":"本块最后一句说完，就接下一块：成分和资质咱们都讲透了，接下来聊聊大家最关心的——今天到底什么价？这个价我可定不了，得孙总来…（12—17 分钟 开始【破价算账】）","ctrl":"弹“国食健注G20250013”特写；弹瓶身“保健功能：有助于维持血脂健康水平”；把“本品不能代替药物”固定在屏幕下方。"},{"no":"④","name":"破价算账","win":"12—17 分钟","dur":300,"cues":[["曾老师","成分和资质咱们都讲透了，接下来聊聊大家最关心的——今天到底什么价？这个价我可定不了，得孙总来拍板。他是厂家品牌运营总监，来，咱们看看孙总今天到底带了多大的诚意！"],["孙总","曾老师，各位家人，咱们不玩虚的。这款敖东植物甾醇银杏叶片，一瓶 24 片，一天 8 片，3 天一瓶。平时咱们线上日常价79.9一瓶，我不藏着掖着，大家随时可以去查。"],["孙总","今天我不一瓶一瓶给大家上，直接上27瓶的大套餐。27乘79.9，原价多少？2157 块。这是大家平时一瓶一瓶去买，实打实要花的钱。不过曾老师，在报今天这机制之前，我觉得你得先给家人们科普一下，为什么咱们今天要上这么大的量？"],["曾老师","通常3 个月，是一个基础小周期。给身体一段持续调养的时间，也正好对上复查节点，到点去医院查一次，看指标、看状态。"],["曾老师","6 个月，是两个小周期叠起来，一个巩固大周期，先打底，再稳住。很多人不是不认可产品，是吃两个月停一个月，刚稳一点又断了，钱花了，劲儿却接不上。"],["曾老师","血脂这事，不光看血管，腰围、内脏脂肪、饮食、运动，都得一起管。它不是一天形成的，也别指望几天就变。真要养，就按 6 个月来，别断档。"],["孙总","曾老师这话在理。所以这次 70 周年，我专门跟总部申请了一个政策：今天下单，买 27 瓶，直接送 27 瓶！27 加 27，54 瓶。总部特批这个量，就是让大家能连着吃、别断。"],["曾老师","买 27 送 27，到手 54 瓶！量是够了。但是孙总，您看看公屏，好多人还在刷“价格还能不能再实在点？”“光有量不行，价还得降！”您今天既然是专程来破价的，这个价您得给家人们露个底。"],["孙总","曾老师，你这是给我出难题。买 27 送 27，已经是总部咬着牙批的了。原料成本、产线成本摆在这儿，再动价，我回去不好交代。"],["曾老师","孙总，厂家要生存，我理解。但今天是敖东建厂 70 周年，直播间都是跟了咱们很久的老粉，真心想长期吃。您是品牌运营总监，这个价您现场就能拍板，别让家人们带着遗憾走。"],["孙总","唉……你这话说到这份上了。行，为了老粉，我今天再破个例，既然今天我是专程来给 70 周年撑场、给家人们谋福利的。总部给的是量，我今天破个价——2157 块，70 周年，我现场直降 777 块！最后 1380 块！"],["曾老师","家人们听到没有！1380 买 54 瓶！孙总真是拼了，这价格简直不敢想！才3 折啊！"],["曾老师","但是孙总，我这儿还有个事。咱们直播有很多是提前付了10块钱定金的家人，那是真信任咱们。现在虽然破价了，到手是 54 瓶，您看对这些提前交定金的家人，是不是还能额外给点专属福利？不然对不起人家这份信任。"],["孙总","曾老师，你今天是真不让我下播了啊！1380 块 54 瓶已经够实惠了，你还要加福利，这让我回去咋交代啊？最多……我只能给预付定金的家人额外加送 3 瓶！"],["曾老师","孙总，3 瓶哪够啊，既然是送，您就大气点！预付的送 3 瓶，那今天在直播间刚下单的家人呢？您也一视同仁，再给刚拍的加送 3 瓶，凑个整！54 加 3 加 3，直接给家人们上 60 瓶！您看行不行？"],["孙总","（面部纠结了一会）行！曾老师，我今天算是彻底被你拿下了！54 瓶再加 6 瓶，60 瓶！1380 块拿 60 瓶！60瓶，正好一个巩固大周期、半年的量。对了，今年满 70 周岁的长辈，凭本人身份证，在 60 瓶之外再送 1 瓶，不占套餐的数。家里有 70 岁老人的，等于 61 瓶拿回家，多的这 1 瓶，是敖东给长辈的敬礼。下单备注“70岁”，找健康顾问核对就能额外送了！咱也先说好，这个机制只限今天直播间70 周年庆这一场！下播恢复79.9一瓶，绝不再送！"],["曾老师","痛快！60 瓶！家人们，咱们来算笔账：1380 除以 60，平均一瓶只要23块！平时79.9，今天23！不到 3 折！一天吃 8 片，花不到 8 块钱，这 60 瓶把半年的量一次备齐，也省得吃一半又断！而且这价格，全网找不出第二个！这个机制，只有今天、只有 70 周年这一场，想要这 60 瓶的家人别犹豫，立刻联系你的健康顾问下单，错过今天，就没有这个福利了！"],["曾老师","孙总，今天场子太火了，有叔叔阿姨一直在刷屏说怕抢不到，咱们今天总共放多少个名额？"],["孙总","今天 70 周年，工厂备货紧，直播间专属名额只有 500 个！抢完马上恢复79.9单瓶，赠品全没！大家需要的赶紧找健康顾问下单。"],["曾老师","只有500个名额，家人们，名额有限，先到先得，赶紧联系您的健康顾问锁定名额！"],["曾老师","（重点提醒70岁福利）好了，再次提醒一下大家开场说的大福利！刚才孙总已经盖章确认，咱们直播间只要今年是70岁的叔叔阿姨，今天下了单，去找您的健康顾问出示一下身份证，厂家额外再送您一瓶银杏叶片！这是咱们敖东建厂70周年给老寿星们的专属敬礼！符合条件的家人们，付款时千万别忘了跟顾问说一声！"],["曾老师","最后再重复一遍：1380元，60瓶，今年70岁老人得61瓶，一瓶到手23块，一天花不到8块钱，买的是敖东大厂70年的品质，也是半年的规律养护。各位叔叔阿姨、大姐们，养护不是一天两天的事，别等，别断，也别犹豫了。现在联系您的健康顾问下单，把名额锁上，下了播就恢复79.9元一瓶，也不再送了。"]],"next":"本块最后一句说完，就接下一块：1380元60 瓶、23一瓶。孙总，这个价今天就是到底了？后面不会再有第二回了吧？（17—26 分钟 开始【库存+有限名额逼单】）","ctrl":"置顶“27瓶+送27瓶+再送6瓶=60瓶”；1380元到手60瓶字样。"},{"no":"⑤","name":"库存+有限名额逼单","win":"17—26 分钟","dur":540,"cues":[["曾老师","1380元60 瓶、23一瓶。孙总，这个价今天就是到底了？后面不会再有第二回了吧？"],["孙总","到底了。买 27 送 27，再直降 777，再送6瓶，利润已经让穿了。这个机制就这一场，下播就收回。"],["曾老师","家人们，这个账我再说一遍：60瓶，一天8片，一瓶3天，整整半年。半年，1380，一天不到8块。您去门店、去线上买一瓶79块9，今天直播只要23，还送到家。"],["曾老师","已经下单的家人，公屏扣“已购”，把省份也打上，让孙总看看到底哪些省的老朋友在支持。"],["曾老师","我再讲讲怎么吃，我是营养师，这个得说细一点。"],["曾老师","50到60岁的，代谢开始慢下来，重点是“查+控”。一天2次、一次4片，饭后温水，先按3个月吃，3个月去复查一次，听医生的，该调药调药，别自己停，也别自己吓自己。"],["曾老师","60到70岁的，身体机能不如从前，重点是“稳”。别今天吃明天忘，规律吃，少油少盐，走走路，规律这件事比什么都强。"],["曾老师","70岁以上的，很多人还有血压、血糖的问题，重点是“养”。该吃的药一顿不能落，这个产品是日常养护，不是替药。家里人要盯着，别让老人自己乱停。"],["孙总","我补一句，70岁以上的家人，儿女给买的，一定盯着吃，别放在柜子里忘了。"],["曾老师","有家人问，60瓶会不会太多？"],["曾老师","不多。一瓶3天，60瓶180天，正好半年。保健食品最怕吃两天就停，既然要养，就按周期来。半年，正好从冬天吃到明年开春。"],["曾老师","来，中控（洋洋）给我个实数：现在还剩多少名额？（报个数）还剩351个。"],["曾老师","我也不催大家，但大家要知道，名额随时消失。本场只放 500 个名额 —— 不是 5000，也不是无限卖。70 周年这批货，工厂就批下来 500 份，多一份都调不出来。"],["曾老师","而且就在刚刚说的这一小会儿，名额又减了50多名，这会儿已经二百几了。大家要真想要，别在公屏问 “还有没有”，直接找健康顾问把名额锁上 —— 您问一句的工夫，可能就少一个。"],["孙总","我这边也交个底：500 个名额，走完就没了。也加不了，也别找我加，批不下来。卖完恢复 79.9 单瓶，买 27 送 27 没有，直降 777，额外送的都没有。"],["曾老师","家人们听见没？孙总把话都说到这份上了，多一份都批不出来！来，已经付款成功的家人，公屏上把【已购】刷起来，让孙总看 const MAXLEN = 52;

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function emphasize(s){
  let out = esc(s);
  out = out.replace(/(\d+(?:\.\d+)?\s*(?:块|元|瓶|片|克|天|个月|%|折|亿|个名额|个)?)/g, "<b>$1</b>");
  out = out.replace(/(买\s*27\s*送\s*27|再送\s*1\s*瓶|只限今天|下播就收回|不能断断续续|千万别拖|药不能停|保价全年)/g, "<em>$1</em>");
  return out;
}

function segment(t){
  const out = [], sents = t.match(/[^。！？；]+[。！？；]?/g) || [t];
  let cur = "";
  for (const s of sents){
    if ((cur + s).length <= MAXLEN){ cur += s; continue; }
    if (cur){ out.push(cur); cur = ""; }
    if (s.length <= MAXLEN){ cur = s; continue; }
    const parts = s.match(/[^，、：]+[，、：]?/g) || [s];
    for (const p of parts){
      if ((cur + p).length <= MAXLEN) cur += p;
      else { if (cur) out.push(cur); cur = p; }
    }
  }
  if (cur) out.push(cur);
  return out;
}

       <span><span class="nm">${b.name}</span><span class="tm">${b.win}</span></span>
     </button>`).join("");
  $("nav").querySelectorAll(".navbtn").forEach(el => el.onclick = () => go(+el.dataset.i));
  const colOf = { "sp zeng":"#0071e3", "sp sun":"#e08a1e", "sp s3":"#8a5cf6", "sp s4":"#1a9e63" };
  const order = SP.__order || Object.keys(SP).filter(k => k !== "go" && k !== "ctl");
  $("legendSpeakers").innerHTML = order.map(k =>
    `<div class="lg"><span class="dot" style="background:${SP[k][2] || colOf[SP[k][1]] || "#8e8e93"}"></span>${SP[k][0]}</div>`).join("");
}

function render(){
  const b = BLOCKS[bi];
  $("hNum").textContent = b.no;
  $("hName").textContent = b.name;
  $("hWin").textContent = b.win;

  const cards = [];
  b.cues.forEach(([sp,t]) => {
    const lines = segment(t).map((part,i) => ({ sp: i === 0 ? sp : null, html: emphasize(part) }));
    cards.push({ lines, special:false });
  });
  cards.push({ lines:[{ sp:"go",  html: esc(b.next) }], special:true });
  if (b.ctrl) cards.push({ lines:[{ sp:"ctl", html: esc(b.ctrl) }], special:true });

  $("cues").innerHTML = cards.map(c=>{
    const firstSp = c.lines[0].sp;
    const hasBadge = !!(SP[firstSp] && SP[firstSp][0]);
    const inner = c.lines.map(ln=>{
      let badge = "";
      if (ln.sp){
        const pair = SP[ln.sp] || ["",""];
        if (pair[0]) badge = `<span class="${pair[1]}">${pair[0]}</span>`;
      } else if (hasBadge){
        badge = `<span class="sp cont">·</span>`;
      }
      return `<div class="line">${badge}<span class="say">${ln.html}</span></div>`;
    }).join("");
    return `<li class="${c.special ? "special" : "start"}">${inner}</li>`;
  }).join("");  $("cues").scrollTop = 0;
  renderNav();
  applyFs();
  paintClock();
}

function paintClock(){
  const b = BLOCKS[bi];
  const t = $("clockT"), bar = $("clockBar");
  t.textContent = left >= 0 ? fmt(left) : "-" + fmt(-left);
  const pct = Math.max(0, Math.min(1, left / (b.dur || 1)));
  bar.style.width = (pct*100).toFixed(1) + "%";
  t.className = "t" + (left < 0 ? " over" : left <= (b.dur||0)*0.2 ? " warn" : "");
  $("flash").className = "flash" + (left < 0 ? " on" : "");
  $("clockHint").textContent = left < 0 ? "已超时 · 该切下一板块了"
    : (running ? "计时中 · 到点切板块" : "剩余时间 · 空格开始");
}

function go(idx){ bi = (idx + BLOCKS.length) % BLOCKS.length; left = BLOCKS[bi].dur; render(); if (running) tickStart(); }
function tickStart(){ clearInterval(timer); timer = setInterval(()=>{ left -= 1; paintClock(); }, 1000); }
function toggle(){ running = !running; if (running) tickStart(); else clearInterval(timer); paintClock(); }
function reset(){ left = BLOCKS[bi].dur; paintClock(); }

let fsVh = parseFloat(localStorage.getItem("tyc_fs") || "2.1");
if (!(fsVh >= 1.2 && fsVh <= 4.2)) fsVh = 2.1;
function applyFs(){
  document.documentElement.style.setProperty("--fs", fsVh.toFixed(2) + "vh");
  const px = parseFloat(getComputedStyle($("cues")).fontSize) || 0;
  $("fsNow").textContent = "字号 " + Math.round(px);
  localStorage.setItem("tyc_fs", fsVh.toFixed(2));
}
function bumpFs(d){ fsVh = Math.min(4.2, Math.max(1.2, +(fsVh + d).toFixed(2))); applyFs(); }

function setRail(collapsed){
  $("rail").classList.toggle("collapsed", collapsed);
  $("railToggle").setAttribute("aria-expanded", String(!collapsed));
}
$("railToggle").onclick = () => setRail(!$("rail").classList.contains("collapsed"));
document.addEventListener("keydown", e=>{
  const ol = $("cues");
  if (e.code === "Space"){ e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight"){ go(bi + 1); }
  else if (e.key === "ArrowLeft"){ go(bi - 1); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); ol.scrollTop += 120; }
  else if (e.key === "ArrowUp"){ e.preventDefault(); ol.scrollTop -= 120; }
  else if (e.key === "r" || e.key === "R"){ reset(); }
  else if (/^[1-9]$/.test(e.key)){ if (+e.key <= BLOCKS.length) go(+e.key - 1); }
  else if (e.key === "-" || e.key === "_"){ e.preventDefault(); bumpFs(-0.15); }
  else if (e.key === "=" || e.key === "+"){ e.preventDefault(); bumpFs(0.15); }
  else if (e.key === "["){ e.preventDefault(); setRail(!$("rail").classList.contains("collapsed")); }
  else if (e.key === "f" || e.key === "F"){
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
});
$("fsUp").onclick = () => bumpFs(0.15);
$("fsDown").onclick = () => bumpFs(-0.15);

render();
</script>
</body>
</html>
